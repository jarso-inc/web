<!DOCTYPE html>
<html>
<head>
<title>Jarso, Inc.</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Arial;}

/* Style the tab */
.tab {
  overflow: hidden;
  border: 1px solid #ccc;
  background-color: #f1f1f1;
}

/* Style the buttons inside the tab */
.tab button {
  background-color: inherit;
  float: left;
  border: none;
  outline: none;
  cursor: pointer;
  padding: 14px 16px;
  transition: 0.3s;
  font-size: 17px;
}

/* Change background color of buttons on hover */
.tab button:hover {
  background-color: #ddd;
}

/* Create an active/current tablink class */
.tab button.active {
  background-color: #ccc;
}

/* Style the tab content */
.tabcontent {
  display: none;
  padding: 6px 12px;
  border: 1px solid #ccc;
  border-top: none;
}
</style>
</head>
<body>
  
<img src="images/jarso_inc.png" alt="Jarso Logo" style="width: 10%; height: auto;">

<div class="tab">
  <button class="tablinks" onclick="openTab(event, 'Socials')">Social Media</button>
  <button class="tablinks" onclick="openTab(event, 'Fresno')">Fresno</button>
  <button class="tablinks" onclick="openTab(event, 'Grover')">Grover Beach</button>
  <button class="tablinks" onclick="openTab(event, 'Oceano')">Oceano</button>
  <button class="tablinks" onclick="openTab(event, 'Calendar')">Calendar</button>
  <button class="tablinks" onclick="openTab(event, 'Contact')">Contact Us</button>
</div>

<div id="Socials" class="tabcontent">
  <h3>Social Media</h3>
    <a href="https://www.facebook.com/profile.php?id=61592911163586" target="_blank">
      <img src="images/facebook.png" alt="Facebook"></a>
    <a href="https://instagram.com/jarso.inc" target="_blank">
      <img src="images/Instagram.png" alt="Instagram"></a>
    <a href="https://tiktok.com/@jarso.inc" target="_blank">
      <img src="images/TikTok.png" alt="TikTok"></a>
</div>

<div id="Fresno" class="tabcontent">
    <img src="images/fremont69.png" alt="Fremont 69" style="width: 50%; height: auto;">
</div>

<div id="Grover" class="tabcontent">
    <img src="images/marseille03.png" alt="Marseille 03" style="width: 50%; height: auto;">
</div>
  
<div id="Oceano" class="tabcontent">

</div>

<div id="Calendar" class="tabcontent">
  <iframe src="https://calendar.google.com/calendar/embed?src=jarso.inc%40gmail.com&ctz=America%2FLos_Angeles" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>
</div>

<div id="Contact" class="tabcontent">
  <h3>Contact Information</h3>
  <p>
    PO Box 9213 <br>
    Fresno, CA &ensp; 93791 &emsp; <br>
    Tel/Text: (559) 408-5021 <br>
    Email: Jarso.inc@gmail.com
  </p>
</div>

<script>
function openTab(evt, cityName) {
  var i, tabcontent, tablinks;
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  tablinks = document.getElementsByClassName("tablinks");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }
  document.getElementById(cityName).style.display = "block";
  evt.currentTarget.className += " active";
}
</script>
   
</body>
</html>
